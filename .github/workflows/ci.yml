name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.9'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Tests including Redis TTL and real HTTP processes
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run --frozen pytest -q
      - name: Build wheel and source distribution
        run: uv build
      - name: Install manifest and workflow validators
        run: |
          bash scripts/install-ci-tools.sh "$RUNNER_TEMP/ci-tools"
          echo "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: Validate workflows and Kubernetes schemas
        run: |
          actionlint
          bash scripts/validate-kubernetes.sh
          bash scripts/validate-monitoring.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  images:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image coordinates
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build proxy image
        id: proxy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: proxy
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          tags: ${{ steps.names.outputs.prefix }}/proxy:${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
      - name: Build mock image
        id: mock
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: mock
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          tags: ${{ steps.names.outputs.prefix }}/mock:${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mock
          cache-to: type=gha,mode=max,scope=mock
      - name: Record immutable release artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          PREFIX: ${{ steps.names.outputs.prefix }}
          IMAGE_TAG: ${{ steps.names.outputs.tag }}
          PROXY_DIGEST: ${{ steps.proxy.outputs.digest }}
          MOCK_DIGEST: ${{ steps.mock.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          sha = os.environ['GITHUB_SHA']
          prefix = os.environ['PREFIX']
          release = {'repository': os.environ['GITHUB_REPOSITORY'], 'source_sha': sha}
          for target in ('proxy', 'mock'):
              release[target] = f"{prefix}/{target}:{os.environ['IMAGE_TAG']}@{os.environ[target.upper() + '_DIGEST']}"
          with open('release.json', 'w') as output:
              json.dump(release, output, indent=2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          name: release
          path: release.json
          if-no-files-found: error
          retention-days: 90
