[project]
name = "pokeproxy"
version = "0.1.0"
description = "Pokemon stream reverse proxy"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "protobuf>=6.31.1",
    "prometheus-client>=0.21",
    "redis[hiredis]>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokeproxy"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["src/pokeproxy/proto/pokemon_pb2.py", "src/pokeproxy/proto/pokemon_pb2.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "ASYNC", "S", "T20", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SIM115"]
"scripts/**" = ["S101", "S311", "T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
