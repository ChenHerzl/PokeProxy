apiVersion: batch/v1
kind: Job
metadata:
  name: pokeproxy-observability-traffic
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: traffic
          image: pokeproxy:part4
          imagePullPolicy: IfNotPresent
          command: [python, -c]
          args:
            - |
              import subprocess, sys
              import httpx
              subprocess.run([sys.executable, "scripts/load_generator.py", "--url", "http://pokeproxy:8000/stream", "--rps", "5", "--duration", "60"], check=True)
              with httpx.Client(timeout=5, trust_env=False) as client:
                  response = client.post("http://pokeproxy:8000/stream", content=b"invalid-signature-demo", headers={"X-Grd-Signature": "0" * 64})
                  assert response.status_code == 401, 'Invalid signature must be rejected'
              print('Verified one intentional invalid-HMAC rejection', flush=True)
          env:
            - name: POKEPROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: pokeproxy-credentials
                  key: POKEPROXY_SECRET
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
