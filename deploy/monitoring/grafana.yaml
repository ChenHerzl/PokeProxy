apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
        ports:
          - name: http
            containerPort: 3000
        env:
          - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
          - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
          - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: 'true'}
          - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
          - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
          - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
          - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: 'false'}
          - {name: GF_NEWS_NEWS_FEED_ENABLED, value: 'false'}
          - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: 'true'}
          - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/pokeproxy.json}
          - name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: grafana-admin
                key: password
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 384Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        startupProbe:
          httpGet: {path: /api/health, port: http}
          periodSeconds: 2
          failureThreshold: 90
          timeoutSeconds: 3
        readinessProbe:
          httpGet: {path: /api/health, port: http}
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet: {path: /api/health, port: http}
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
          - {name: data, mountPath: /var/lib/grafana}
          - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
          - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
          - {name: providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
          - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: providers
          configMap: {name: grafana-providers}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - {name: http, port: 3000, targetPort: http}
  type: ClusterIP
