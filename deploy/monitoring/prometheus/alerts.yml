groups:
  - name: pokeproxy
    rules:
      - alert: PokeProxyScrapeUnavailable
        expr: (sum(up{job="pokeproxy"}) or vector(0)) == 0
        for: 1m
        labels:
          severity: critical
          service: pokeproxy
        annotations:
          summary: No PokeProxy Pod can be scraped
          runbook: docs/alerts.md#pokeproxyscrapeunavailable
      - alert: PokeProxyForwardingFailures
        expr: |
          (sum(increase(pokeproxy_forward_total{job="pokeproxy",outcome!="success"}[5m]))
            / sum(increase(pokeproxy_forward_total{job="pokeproxy"}[5m]))) > 0.05
          and sum(increase(pokeproxy_forward_total{job="pokeproxy"}[5m])) >= 20
        for: 2m
        labels:
          severity: critical
          service: pokeproxy
        annotations:
          summary: More than 5% of downstream attempts fail
          runbook: docs/alerts.md#pokeproxyforwardingfailures
      - alert: PokeProxyServerErrors
        expr: |
          (sum(increase(pokeproxy_requests_total{job="pokeproxy",status=~"5.."}[5m]))
            / sum(increase(pokeproxy_requests_total{job="pokeproxy"}[5m]))) > 0.05
          and sum(increase(pokeproxy_requests_total{job="pokeproxy"}[5m])) >= 20
        for: 2m
        labels:
          severity: critical
          service: pokeproxy
        annotations:
          summary: More than 5% of stream handlers finish with server errors
          runbook: docs/alerts.md#pokeproxyservererrors
      - alert: PokeProxySlowProcessing
        expr: |
          ((sum(increase(pokeproxy_request_duration_seconds_count{job="pokeproxy"}[5m]))
            - sum(increase(pokeproxy_request_duration_seconds_bucket{job="pokeproxy",le="1.0"}[5m])))
            / sum(increase(pokeproxy_request_duration_seconds_count{job="pokeproxy"}[5m]))) > 0.10
          and sum(increase(pokeproxy_request_duration_seconds_count{job="pokeproxy"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
          service: pokeproxy
        annotations:
          summary: More than 10% of stream handlers take over one second
          runbook: docs/alerts.md#pokeproxyslowprocessing
      - alert: PokeProxyCacheErrors
        expr: |
          (sum(increase(pokeproxy_cache_total{job="pokeproxy",outcome=~"read_error|write_error"}[5m]))
            / sum(increase(pokeproxy_cache_total{job="pokeproxy"}[5m]))) > 0.10
          and sum(increase(pokeproxy_cache_total{job="pokeproxy"}[5m])) >= 20
        for: 5m
        labels:
          severity: warning
          service: pokeproxy
        annotations:
          summary: More than 10% of cache operations fail
          runbook: docs/alerts.md#pokeproxycacheerrors
