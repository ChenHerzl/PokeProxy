apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-downstream
  labels: &id001
    app.kubernetes.io/name: mock-downstream
    app.kubernetes.io/part-of: pokeproxy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-downstream
        app.kubernetes.io/part-of: pokeproxy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mock-downstream
        image: pokeproxy-mock:part2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8001
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 250m
            memory: 128Mi
        envFrom:
        - configMapRef:
            name: mock-settings
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-downstream
  labels:
    app.kubernetes.io/name: mock-downstream
    app.kubernetes.io/part-of: pokeproxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock-downstream
    app.kubernetes.io/part-of: pokeproxy
  ports:
  - name: http
    port: 8001
    targetPort: http
