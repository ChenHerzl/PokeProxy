apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: &id001
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: pokeproxy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: pokeproxy
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
        imagePullPolicy: IfNotPresent
        ports:
        - name: redis
          containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            cpu: 250m
            memory: 96Mi
        command:
        - redis-server
        args:
        - /etc/redis/redis.conf
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: pokeproxy-credentials
              key: REDIS_PASSWORD
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - test "$(redis-cli ping)" = PONG
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - test "$(redis-cli ping)" = PONG
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - test "$(redis-cli ping)" = PONG
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/redis
          readOnly: true
        - name: acl
          mountPath: /run/redis
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: config
        configMap:
          name: redis-config
      - name: acl
        secret:
          secretName: pokeproxy-credentials
          defaultMode: 288
          items:
          - key: users.acl
            path: users.acl
      - name: data
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: pokeproxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: pokeproxy
  ports:
  - name: redis
    port: 6379
    targetPort: redis
